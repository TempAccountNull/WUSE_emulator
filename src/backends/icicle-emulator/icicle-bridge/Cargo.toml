[package]
name = "icicle"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu" }
icicle-cpu = { git = "https://github.com/icicle-emu/icicle-emu" }
pcode = { git = "https://github.com/icicle-emu/icicle-emu" }

[patch."https://github.com/icicle-emu/icicle-emu"]
icicle-mem = { path = "vendor/icicle-mem" }

[patch.crates-io]
cranelift-jit = { path = "vendor/cranelift-jit" }
